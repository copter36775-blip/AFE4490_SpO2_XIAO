; =====================================================================
;  AFE4490_XIAO - TI AFE4490 pulse oximeter on a Seeed XIAO nRF52840 Sense
; =====================================================================
;  Two board revisions, two firmwares, one source tree. Only one main.cpp
;  is compiled per environment; build_src_filter picks which.
;
;    v2_ble  (default)  src/main.cpp     rev 2 wiring, USB + BLE, SW on D5
;    v1_usb             src/main_v1.cpp  rev 1 wiring, USB only
;
;    pio run                     build the default (rev 2)
;    pio run -t upload           build and flash rev 2
;    pio run -e v1_usb -t upload go back to rev 1
;
;  The AFE runs on SPIM1, not the default SPI bus - see main.cpp. SPIM1
;  shares a peripheral ID with TWIM1, so Wire1 must stay unused.
; =====================================================================
[platformio]
default_envs = v2_ble

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoblesense_adafruit
framework = arduino

monitor_speed = 115200

; No port is pinned here on purpose. PlatformIO finds the board by its USB
; VID:PID, so any XIAO nRF52840 enumerates and uploads without editing this
; file - which matters the moment there is more than one board on the bench.
; Override for a single command instead:  pio run -t upload --upload-port COM7
; If several boards are attached at once, that flag is how you pick.

build_flags =
    -DCFG_DEBUG=0

; ---------------------------------------------------------------------
;  Rev 2: CS D0, MOSI D1, SCK D2, MISO D3, DRDY D4, SW1 D5.
;  RESET and PWDN are not brought out, so resets go through CONTROL0.
;  USB CDC and a BLE Nordic UART Service carry the same protocol A1
;  frames; the button on D5 chooses which link the LED is presenting.
; ---------------------------------------------------------------------
[env:v2_ble]
build_src_filter = +<*> -<main_v1.cpp>

; ---------------------------------------------------------------------
;  Rev 1: RDY D0, MISO D1, SCK D2, MOSI D3, CS D4, RESET D5, PWDN D6.
;  USB CDC only - no BLE stack is linked, which keeps the 6-channel
;  stream free of SoftDevice radio jitter.
; ---------------------------------------------------------------------
[env:v1_usb]
build_src_filter = +<*> -<main.cpp>
